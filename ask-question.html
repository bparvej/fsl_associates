<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Now - Fair & Square Legal Associates</title>
    <link rel="stylesheet" href="assets/css/style.min.css">
    <link rel="stylesheet" href="assets/css/pages.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></noscript>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero hero--short">
        <h1 class="hero-title">Ask for Legal Aid</h1>
    </section>

    <section class="dark-section">
        <div class="ask-container">
            <div class="ask-form-box animate-on-scroll">
                <h1 class="serif">Free Consultancy</h1>
                <p>Please provide your details and the nature of your query.</p>
                <form id="legalAidForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label for="mobile">Mobile</label>
                        <input type="tel" id="mobile" name="mobile" required placeholder="Your contact number">
                    </div>
                    <div class="form-group">
                        <label for="aid-type">What sort of Legal Aid you are looking for</label>
                        <textarea id="aid-type" name="aid-type" required placeholder="Describe your legal requirements..."></textarea>
                    </div>
                    <button type="submit" class="ask-submit-btn">Submit Query</button>
                </form>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="assets/js/main.min.js" defer></script>
    <script src="assets/js/pages.min.js" defer></script>
</body>
</html>
